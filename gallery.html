<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gallery - Batsetsa Nyame</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin: 40px auto;
            max-width: 1200px;
            padding: 0 20px;
            flex-wrap: wrap;
        }
        .art-card {
            background: rgba(0, 120, 212, 0.2);
            border: 2px solid #0078d4;
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 120, 212, 0.3);
            transition: transform 0.2s;
        }
        .art-card:hover {
            transform: translateY(-5px);
        }
        .art-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        h2 {
            color: #00bfff;
            font-size: 1.4rem;
            margin: 10px 0 5px 0;
            font-family: sans-serif;
        }
        p {
            color: #e0e0e0;
            font-size: 1rem;
            margin: 5px 0;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <h1>My Artwork</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="gallery">

        <div class="art-card">
            <img src="images/more_pond.jpg" alt="Ocean Memories">
            <h2>Ocean Memories</h2>
            <p>Medium: Acrylic Paint</p>
            <p><strong>Price: P1,500</strong></p>
        </div>

        <div class="art-card">
            <img src="images/pond_flowers.jpg" alt="Time & Tide">
            <h2>Time & Tide</h2>
            <p>Medium: Oil Paint</p>
            <p><strong>Price: P2,000</strong></p>
        </div>

        <div class="art-card">
            <img src="images/water_lilies.jpg" alt="Mechanical Soul">
            <h2>Mechanical Soul</h2>
            <p>Medium: Mixed Media</p>
            <p><strong>Price: P1,800</strong></p>
        </div>

    </div>

    <footer>
        <p>2026 Batsetsa Nyame | All Rights Reserved</p>
        <p>Email: bida25-021@thuto.bac.ac.bw</p>
    </footer>

</body>
</html>
